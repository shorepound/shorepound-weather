<main>
  <h1>{{ title() }}</h1>

  <section>
    <app-location-input (location)="onLocation($event)"></app-location-input>
  </section>

  <section style="margin-top:12px;">
    <app-forecast [periods]="periods"></app-forecast>
  </section>

  <section style="margin-top:18px;">
    <app-zip-input (zipSubmit)="onZip($event)"></app-zip-input>
    <div *ngIf="currentConditions" style="margin-top:8px;">
      <h3>Current Conditions</h3>
      <div>{{ currentConditions.textDescription }}</div>
      <div *ngIf="currentConditions.temperature">Temperature: {{ currentConditions.temperature.value }} {{ currentConditions.temperature.unitCode }}</div>
      <div *ngIf="currentConditions.windSpeed">Wind: {{ currentConditions.windSpeed }}</div>
    </div>
  </section>
</main>
